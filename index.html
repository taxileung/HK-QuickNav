<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>MyMapHK 快速導航</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <div class="button-stack">
      <form id="search-form" class="search-form" role="search" aria-label="搜尋香港地點">
        <label class="sr-only" for="place-input">輸入地點</label>
        <div class="search-box">
          <input id="place-input" class="place-input" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" maxlength="60" placeholder="輸入地點">
          <button id="search-button" class="action-button search-button" type="submit">搜尋</button>
        </div>
        <p id="search-status" class="search-status" aria-live="polite" hidden></p>
        <div id="search-results" class="search-results" hidden></div>
      </form>

      <button id="paste-button" class="action-button paste-button" type="button" aria-label="貼上 MyMapHK 座標">
        <span id="paste-label" class="paste-label">貼上</span>
      </button>

      <div class="map-row">
        <button id="waze-button" class="action-button maps-button waze-button" type="button" aria-label="使用 Waze 導航" disabled>
          <img class="map-icon" src="./icon/Waze.png" alt="" aria-hidden="true">
          <span class="sr-only">Waze</span>
        </button>

        <button id="google-button" class="action-button maps-button google-button" type="button" aria-label="使用 Google 地圖導航" disabled>
          <img class="map-icon" src="./icon/GoogleMaps.png" alt="" aria-hidden="true">
          <span class="sr-only">Google 地圖</span>
        </button>

        <button id="amap-button" class="action-button maps-button amap-button" type="button" aria-label="使用高德地圖導航" disabled>
          <img class="map-icon" src="./icon/AMP.png" alt="" aria-hidden="true">
          <span class="sr-only">高德地圖</span>
        </button>
      </div>
    </div>

    <p id="live-region" class="sr-only" aria-live="polite"></p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
